spring:
  datasource:
    druid:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: bigdata365
      password: bigdata365
      # ?serverTimezone=UTC???????
      jdbc-url: jdbc:mysql://127.0.0.1:3306/bigdata365?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
      driverClass: com.mysql.cj.jdbc.Driver
      passwordCallbackClassName: com.mlj.share.big365.example.config.DruidCustomPasswordCallback
      # Spring Boot ???????????????????
      # druid ???????
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      # ?????????filters?stat:?????log4j??????wall???sql??
      # ???????  java.lang.ClassNotFoundException: org.apache.log4j.Priority
      # ??? log4j ?????Maven ???https://mvnrepository.com/artifact/log4j/log4j
      max-pool-prepared-statement-per-connection-size: 20
      use-global-data-source-stat: true
      filter:
        stat:
        merge-sql: true
        slow-sql-millis: 50
      proxy-filters: stat,wall,log4j
      connect-properties:
        password: YmlnZGF0YTM2NQ==

server:
  port: 8081
  servlet:
    context-path: /big365


